name: Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libboost-all-dev \
          libfuse-dev \
          libssl-dev \
          zlib1g-dev \
          pkg-config

    - name: Build (debug)
      run: bash build-debug.sh

    - name: Run tests and capture output
      run: |
        mkdir -p build-debug/test-output
        cd build-debug
        failed_tests=0
        for test in test/test_*; do
          if [ -f "$test" ]; then
            testname=$(basename "$test")
            echo "Running: $testname"
            if "$test" 2>&1 | tee "test-output/$testname.log"; then
              echo "✓ $testname passed"
            else
              echo "✗ $testname failed"
              failed_tests=$((failed_tests + 1))
            fi
          fi
        done
        exit $failed_tests

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: build-debug/test-output/
