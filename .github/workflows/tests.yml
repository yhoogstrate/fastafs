name: Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libboost-all-dev \
          libfuse-dev \
          libssl-dev \
          zlib1g-dev \
          pkg-config

    - name: Build (debug)
      run: bash build-debug.sh

    - name: Run tests
      run: ctest --test-dir build-debug -VV --output-on-failure
